<html lang="en" class="dark">

<head>

  <meta name="theme-color" content="#000000" />

    content="geneie.ai - Upload and analyze variant calling result files with intelligent AI-powered analysis" />

      try {
        var stored = localStorage.getItem('geneie-theme');
        document.documentElement.classList.toggle('dark', stored !== 'light');
      } catch (e) { /* storage blocked — keep the dark class from the markup */ }
    })();
  </script>
